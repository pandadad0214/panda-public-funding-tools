[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "panda-public-funding-tools"
version = "0.1.0"
description = "Panda Public Funding Tools: US federal money and filings: grants, contracts, SBIR/STTR topics, SEC financials, clinical trials."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Panda Federation (pandadad0214)" }]
keywords = ["mcp", "mcp-server", "apify", "panda-federation", "public-funding"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "panda-federation-tools>=1.4.0,<2",
]

[project.urls]
Homepage = "https://github.com/pandadad0214/panda-public-funding-tools"
Source = "https://github.com/pandadad0214/panda-public-funding-tools"
"Umbrella index" = "https://github.com/pandadad0214/panda-federation-tools"
"Apify Store" = "https://apify.com/pandadad0214"

[project.scripts]
panda-public-funding-tools = "panda_public_funding_tools.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_public_funding_tools"]
